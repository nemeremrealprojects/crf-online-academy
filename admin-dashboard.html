<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | CRF Online Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header dashboard-header">
      <a class="brand" href="index.html">
        <span class="brand-mark">CRF</span>
        <span>Admin Portal</span>
      </a>
      <button class="btn btn-secondary" id="logout-btn">Log out</button>
    </header>

    <main class="dashboard-shell reveal">
      <section class="dashboard-intro">
        <div>
          <p class="eyebrow">Admin dashboard</p>
          <h1>Operations overview</h1>
          <p>Review learner activity, lesson enrollments, and payments at a glance.</p>
        </div>
      </section>

      <section class="stats-grid">
        <article class="stat-card">
          <h3>Active learners</h3>
          <p id="admin-learners">24</p>
        </article>
        <article class="stat-card">
          <h3>Pending payments</h3>
          <p id="admin-payments">3</p>
        </article>
        <article class="stat-card">
          <h3>Live classes</h3>
          <p>6</p>
        </article>
      </section>

      <section class="panel">
        <h2>Recent enrollments</h2>
        <table class="table">
          <thead>
            <tr>
              <th>Student</th>
              <th>Class</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="admin-table-body"></tbody>
        </table>
      </section>
      <div id="dashboard-message" class="form-message"></div>
    </main>
  </body>
</html>
