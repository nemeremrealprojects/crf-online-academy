<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | CRF Online Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="script.js" defer></script>
  </head>
  <body class="auth-page">
    <header class="site-header auth-header">
      <a class="brand" href="index.html">
        <span class="brand-mark">CRF</span>
        <span>Craddle Reading Foundation Online Academy</span>
      </a>
    </header>

    <main class="auth-shell">
      <section class="auth-card reveal">
        <p class="eyebrow">Start learning</p>
        <h1>Create your account</h1>
        <p class="auth-subtitle">Secure your child’s place in a vibrant English learning community.</p>
        <form id="register-form" class="auth-form">
          <label>
            Full name
            <input type="text" id="register-name" required />
          </label>
          <label>
            Email address
            <input type="email" id="register-email" required />
          </label>
          <label>
            Password
            <input type="password" id="register-password" required />
          </label>
          <label>
            Choose a role
            <select id="register-role">
              <option value="student">Student</option>
              <option value="admin">Admin</option>
            </select>
          </label>
          <button type="submit" class="btn btn-primary full-width">Register</button>
        </form>
        <div id="form-message" class="form-message" aria-live="polite"></div>
        <p class="auth-link">
          Already have an account?
          <a href="login.html">Sign in</a>
        </p>
      </section>
    </main>
  </body>
</html>
